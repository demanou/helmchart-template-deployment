# Production-style setup: autoscaling behind an NGINX Ingress with TLS
service:
  type: ClusterIP

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: helloapp.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: helloapp-tls
      hosts:
        - helloapp.example.com

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
